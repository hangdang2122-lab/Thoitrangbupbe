<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Phòng Thay Đồ Hoàng Gia - Công Chúa Xinh Đẹp</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Quicksand & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --pink-primary: #ff6b9d;
      --pink-soft: #ffe4ee;
      --purple-soft: #f3e8ff;
      --gold-accent: #f59e0b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #fff0f5 0%, #f8e8ff 50%, #e0f2fe 100%);
      color: #4a354f;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-royal {
      font-family: 'Playfair Display', serif;
    }

    /* Thanh cuộn tùy chỉnh mềm mại */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 228, 238, 0.5);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: #f9a8d4;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f472b6;
    }

    /* Hiệu ứng nút bấm bồng bềnh dễ thương */
    .btn-cute {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 0 rgba(219, 39, 119, 0.2), 0 6px 12px rgba(244, 114, 182, 0.2);
    }
    .btn-cute:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 rgba(219, 39, 119, 0.25), 0 10px 18px rgba(244, 114, 182, 0.3);
    }
    .btn-cute:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(219, 39, 119, 0.2);
    }

    /* Thẻ chọn đồ */
    .item-card {
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 2.5px solid #fce7f3;
      background: rgba(255, 255, 255, 0.9);
    }
    .item-card:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: #f9a8d4;
      box-shadow: 0 8px 16px -4px rgba(244, 114, 182, 0.25);
    }
    .item-card.selected {
      border-color: #ec4899;
      background: linear-gradient(180deg, #fff5f8 0%, #ffe4f0 100%);
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2), 0 8px 16px -4px rgba(236, 72, 153, 0.3);
    }

    /* Hiệu ứng chớp mắt tự nhiên cho nhân vật SVG */
    @keyframes princessBlink {
      0%, 92%, 100% {
        transform: scaleY(1);
      }
      96% {
        transform: scaleY(0.08);
      }
    }
    .eye-blink-group {
      transform-origin: center 192px;
      animation: princessBlink 4.8s infinite ease-in-out;
    }

    /* Hiệu ứng thở nhẹ nhàng cho công chúa */
    @keyframes gentleFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-4px);
      }
    }
    .princess-breathe {
      animation: gentleFloat 3.6s ease-in-out infinite;
    }

    /* Hiệu ứng vỗ cánh tiên nhẹ nhàng */
    @keyframes wingFlutter {
      0%, 100% {
        transform: scaleX(1);
      }
      50% {
        transform: scaleX(0.92);
      }
    }
    .wings-animate {
      transform-origin: 200px 290px;
      animation: wingFlutter 2.4s ease-in-out infinite;
    }

    /* Hạt lấp lánh phép thuật bay lên */
    @keyframes sparklePop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
      }
      40% {
        opacity: 1;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(90deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx) * 1.6), calc(-50% + var(--dy) * 1.6 - 25px)) scale(0.3) rotate(180deg);
      }
    }
    .magic-sparkle {
      position: absolute;
      pointer-events: none;
      animation: sparklePop 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      z-index: 40;
    }

    /* Khung sân khấu có viền ren vàng hoàng gia */
    .royal-stage {
      box-shadow: 
        0 12px 32px rgba(190, 24, 93, 0.15),
        inset 0 0 0 4px rgba(255, 255, 255, 0.7),
        inset 0 0 24px rgba(255, 228, 238, 0.8);
    }

    /* Modal mượt */
    .modal-backdrop {
      backdrop-filter: blur(6px);
      background: rgba(74, 53, 79, 0.45);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- THANH TIÊU ĐỀ HOÀNG GIA -->
  <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-pink-200 px-3 sm:px-6 py-2.5 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <!-- Logo & Tên game -->
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-pink-400 via-rose-400 to-amber-300 flex items-center justify-center text-white shadow-md border-2 border-white">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
            <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
          </svg>
        </div>
        <div>
          <h1 class="font-royal text-lg sm:text-xl font-bold bg-gradient-to-r from-pink-600 via-purple-600 to-amber-600 bg-clip-text text-transparent leading-tight">
            Phòng Thay Đồ Hoàng Gia
          </h1>
          <p class="text-[11px] sm:text-xs text-pink-500 font-semibold">✨ Công Chúa Xinh Đẹp ✨</p>
        </div>
      </div>

      <!-- Nhóm nút điều khiển nhanh -->
      <div class="flex items-center gap-1.5 sm:gap-2.5">
        <!-- Nút Âm thanh -->
        <button id="btn-sound" onclick="toggleSound()" title="Bật/Tắt âm thanh"
          class="btn-cute px-3 py-2 rounded-2xl bg-pink-50 hover:bg-pink-100 text-pink-600 border border-pink-200 font-bold text-xs sm:text-sm flex items-center gap-1.5">
          <span id="sound-icon">🔊</span>
          <span class="hidden md:inline" id="sound-label">Âm thanh</span>
        </button>

        <!-- Nút Bộ sưu tập -->
        <button onclick="openGalleryModal()" title="Xem bộ sưu tập đã lưu"
          class="btn-cute px-3 py-2 rounded-2xl bg-purple-50 hover:bg-purple-100 text-purple-600 border border-purple-200 font-bold text-xs sm:text-sm flex items-center gap-1.5 relative">
          <span>🖼️</span>
          <span class="hidden sm:inline">Bộ Sưu Tập</span>
          <span id="gallery-badge" class="bg-purple-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span>
        </button>

        <!-- Nút Phối Ngẫu Nhiên -->
        <button onclick="randomizeOutfit()"
          class="btn-cute px-3 sm:px-4 py-2 rounded-2xl bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white font-bold text-xs sm:text-sm flex items-center gap-1.5">
          <span>🪄</span>
          <span>Phối Ngẫu Nhiên</span>
        </button>

        <!-- Nút Đặt Lại -->
        <button onclick="resetOutfit()"
          class="btn-cute px-3 py-2 rounded-2xl bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 font-bold text-xs sm:text-sm flex items-center gap-1.5">
          <span>🔄</span>
          <span class="hidden sm:inline">Đặt Lại</span>
        </button>
      </div>
    </div>
  </header>

  <!-- KHU VỰC CHƠI CHÍNH -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-5 grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6 items-start">
    
    <!-- CỘT TRÁI: SÂN KHẤU CÔNG CHÚA (5 cột trên desktop) -->
    <section class="lg:col-span-5 flex flex-col items-center">
      <div id="stage-container" class="royal-stage relative w-full max-w-[420px] aspect-[4/5] rounded-3xl overflow-hidden border-4 border-white transition-all duration-500">
        
        <!-- Lớp Sparkle hiệu ứng phép thuật -->
        <div id="sparkle-layer" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>

        <!-- Nhãn tên bối cảnh góc trên trái -->
        <div class="absolute top-3 left-3 z-10 bg-white/80 backdrop-blur-sm px-3 py-1 rounded-full border border-pink-200 shadow-sm flex items-center gap-1.5">
          <span class="text-xs">🏰</span>
          <span id="bg-title-badge" class="text-xs font-bold text-pink-700">Sảnh Cung Điện Vàng</span>
        </div>

        <!-- Điểm phong cách trực tiếp góc trên phải -->
        <div class="absolute top-3 right-3 z-10 bg-gradient-to-r from-amber-400 to-pink-500 text-white px-3 py-1 rounded-full shadow-sm flex items-center gap-1">
          <span class="text-xs">👑</span>
          <span id="live-style-score" class="text-xs font-bold">Lộng Lẫy</span>
        </div>

        <!-- SVG NHÂN VẬT CÔNG CHÚA NHIỀU LỚP SẮC NÉT -->
        <svg id="princess-svg" viewBox="0 0 400 500" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Gradients cho các bối cảnh -->
            <linearGradient id="bg-palace" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fef3c7"/>
              <stop offset="50%" stop-color="#fde68a"/>
              <stop offset="100%" stop-color="#fbcfe8"/>
            </linearGradient>
            <linearGradient id="bg-garden" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e0f2fe"/>
              <stop offset="55%" stop-color="#dcfce7"/>
              <stop offset="100%" stop-color="#fce7f3"/>
            </linearGradient>
            <linearGradient id="bg-ice" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#cffafe"/>
              <stop offset="55%" stop-color="#bae6fd"/>
              <stop offset="100%" stop-color="#e0e7ff"/>
            </linearGradient>
            <linearGradient id="bg-forest" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1e1b4b"/>
              <stop offset="55%" stop-color="#4c1d95"/>
              <stop offset="100%" stop-color="#831843"/>
            </linearGradient>

            <!-- Soft shadow cho nhân vật -->
            <radialGradient id="floor-shadow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(131, 24, 67, 0.28)"/>
              <stop offset="100%" stop-color="rgba(131, 24, 67, 0)"/>
            </radialGradient>

            <!-- Má hồng mềm -->
            <radialGradient id="blush-grad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ff6b9d" stop-opacity="0.65"/>
              <stop offset="100%" stop-color="#ff6b9d" stop-opacity="0"/>
            </radialGradient>

            <!-- Bóng mượt tóc -->
            <linearGradient id="hair-shine" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
              <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
              <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
            </linearGradient>
          </defs>

          <!-- LỚP 1: BỐI CẢNH (BACKGROUND) -->
          <g id="layer-background"></g>

          <!-- Bóng đổ dưới chân công chúa -->
          <ellipse cx="200" cy="466" rx="105" ry="16" fill="url(#floor-shadow)" />

          <!-- NHÓM NHÂN VẬT CHÍNH (Có hiệu ứng nhịp thở nhẹ) -->
          <g class="princess-breathe">
            
            <!-- LỚP 2: CÁNH TIÊN / PHỤ KIỆN SAU LƯNG -->
            <g id="layer-wings" class="wings-animate"></g>

            <!-- LỚP 3: TÓC SAU (BACK HAIR) -->
            <g id="layer-hair-back"></g>

            <!-- LỚP 4: CƠ THỂ CƠ BẢN (CỔ, VAI, TAY, CHÂN, GIÀY) -->
            <g id="layer-body">
              <!-- Chân thon -->
              <path d="M182 375 L180 456 Q180 463 186 463 Q192 463 192 456 L194 375 Z" fill="#ffe0bd" class="skin-fill"/>
              <path d="M206 375 L208 456 Q208 463 214 463 Q220 463 220 456 L218 375 Z" fill="#ffe0bd" class="skin-fill"/>
              <!-- Giày búp bê hoàng gia -->
              <path d="M178 452 Q186 449 194 452 L194 461 Q186 466 178 461 Z" fill="#f43f5e" class="shoe-fill"/>
              <circle cx="186" cy="454" r="2.2" fill="#fde047"/>
              <path d="M206 452 Q214 449 222 452 L222 461 Q214 466 206 461 Z" fill="#f43f5e" class="shoe-fill"/>
              <circle cx="214" cy="454" r="2.2" fill="#fde047"/>

              <!-- Cánh tay trái & phải duyên dáng -->
              <path d="M166 252 Q144 288 148 326 Q151 334 157 331 Q161 326 160 315 Q160 288 174 264 Z" fill="#ffe0bd" class="skin-fill" stroke="#d49a7a" stroke-width="0.8"/>
              <path d="M234 252 Q256 288 252 326 Q249 334 243 331 Q239 326 240 315 Q240 288 226 264 Z" fill="#ffe0bd" class="skin-fill" stroke="#d49a7a" stroke-width="0.8"/>

              <!-- Cổ & Thân trên -->
              <path d="M189 224 L189 248 L211 248 L211 224 Z" fill="#ffe0bd" class="skin-fill"/>
              <!-- Bóng đổ nhẹ dưới cằm lên cổ -->
              <ellipse cx="200" cy="233" rx="11" ry="5" fill="rgba(160, 90, 70, 0.16)"/>
              
              <!-- Thân trên cơ bản (sẽ được váy che phủ) -->
              <path d="M167 248 Q200 242 233 248 L227 308 Q200 315 173 308 Z" fill="#ffe0bd" class="skin-fill"/>
              <!-- Nội y lụa trắng cơ bản khi chưa mặc váy (luôn kín đáo) -->
              <path d="M170 256 Q200 264 230 256 L226 308 Q200 314 174 308 Z" fill="#fff1f2"/>
            </g>

            <!-- LỚP 5: VÒNG CỔ / TRANG SỨC CỔ -->
            <g id="layer-necklace"></g>

            <!-- LỚP 6: VÁY & TRANG PHỤC CHÍNH (DRESS) -->
            <g id="layer-dress"></g>

            <!-- LỚP 7: PHỤ KIỆN CẦM TAY (ĐŨA PHÉP, TÚI XÁCH) -->
            <g id="layer-hand-item"></g>

            <!-- LỚP 8: ĐẦU & KHUÔN MẶT CHIBI/ANIME -->
            <g id="layer-head">
              <!-- Tai trái & phải -->
              <ellipse cx="144" cy="188" rx="7" ry="11" fill="#ffe0bd" class="skin-fill" stroke="#d49a7a" stroke-width="0.8"/>
              <ellipse cx="256" cy="188" rx="7" ry="11" fill="#ffe0bd" class="skin-fill" stroke="#d49a7a" stroke-width="0.8"/>
              <!-- Khuyên tai ngọc trai nhỏ -->
              <circle cx="143" cy="197" r="3" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
              <circle cx="257" cy="197" r="3" fill="#fff" stroke="#f59e0b" stroke-width="1"/>

              <!-- Khuôn mặt bầu bĩnh dễ thương -->
              <path d="M146 168 
                       C146 126, 254 126, 254 168 
                       C254 206, 232 231, 200 231 
                       C168 231, 146 206, 146 168 Z" 
                    fill="#ffe0bd" class="skin-fill" stroke="#d49a7a" stroke-width="1"/>
            </g>

            <!-- LỚP 9: TRANG ĐIỂM MẶT (PHẤN MÁ, HỌA TIẾT LẤP LÁNH) -->
            <g id="layer-makeup-blush"></g>

            <!-- LỚP 10: MẮT, LÔNG MÀY & BIỂU CẢM -->
            <g id="layer-eyes-mouth"></g>

            <!-- LỚP 11: TÓC MÁI & TÓC TRƯỚC (FRONT HAIR) -->
            <g id="layer-hair-front"></g>

            <!-- LỚP 12: PHỤ KIỆN TÓC (VƯƠNG MIỆN, KẸP HOA) -->
            <g id="layer-headwear"></g>

          </g>
        </svg>

        <!-- Nút Chụp Ảnh nổi bật ở đáy sân khấu -->
        <div class="absolute bottom-3 inset-x-3 z-20 flex justify-center">
          <button onclick="openSnapshotModal()"
            class="btn-cute px-5 py-2.5 rounded-full bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-white font-bold text-sm sm:text-base shadow-lg border-2 border-white flex items-center gap-2">
            <span>📸</span>
            <span>Chụp Ảnh & Lưu Bộ Sưu Tập</span>
          </button>
        </div>
      </div>
    </section>

    <!-- CỘT PHẢI: TỦ ĐỒ & BẢNG TRANG ĐIỂM (7 cột trên desktop) -->
    <section class="lg:col-span-7 bg-white/85 backdrop-blur-md rounded-3xl border-2 border-pink-100 shadow-xl p-3.5 sm:p-5 flex flex-col">
      
      <!-- THANH CHỌN 6 DANH MỤC CHÍNH -->
      <nav aria-label="Danh mục tùy chỉnh" class="grid grid-cols-3 sm:grid-cols-6 gap-1.5 sm:gap-2 mb-4">
        <button onclick="switchTab('face')" data-tab="face"
          class="tab-btn active flex flex-col items-center justify-center py-2 px-1 rounded-2xl font-bold text-xs transition-all border-2">
          <span class="text-lg sm:text-xl mb-0.5">😊</span>
          <span>Khuôn Mặt</span>
        </button>
        <button onclick="switchTab('hair')" data-tab="hair"
          class="tab-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl font-bold text-xs transition-all border-2">
          <span class="text-lg sm:text-xl mb-0.5">💇‍♀️</span>
          <span>Kiểu Tóc</span>
        </button>
        <button onclick="switchTab('makeup')" data-tab="makeup"
          class="tab-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl font-bold text-xs transition-all border-2">
          <span class="text-lg sm:text-xl mb-0.5">💄</span>
          <span>Trang Điểm</span>
        </button>
        <button onclick="switchTab('dress')" data-tab="dress"
          class="tab-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl font-bold text-xs transition-all border-2">
          <span class="text-lg sm:text-xl mb-0.5">👗</span>
          <span>Váy Dạ Hội</span>
        </button>
        <button onclick="switchTab('accessory')" data-tab="accessory"
          class="tab-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl font-bold text-xs transition-all border-2">
          <span class="text-lg sm:text-xl mb-0.5">👑</span>
          <span>Phụ Kiện</span>
        </button>
        <button onclick="switchTab('background')" data-tab="background"
          class="tab-btn flex flex-col items-center justify-center py-2 px-1 rounded-2xl font-bold text-xs transition-all border-2">
          <span class="text-lg sm:text-xl mb-0.5">🏰</span>
          <span>Bối Cảnh</span>
        </button>
      </nav>

      <!-- NỘI DUNG TỦ ĐỒ ĐỘNG THEO TAB -->
      <div id="wardrobe-panel" class="flex-1 overflow-y-auto max-h-[540px] pr-1 space-y-5">
        <!-- Nội dung được render tự động bằng JavaScript -->
      </div>
    </section>

  </main>

  <!-- MODAL 1: THẺ CHÂN DUNG & CHỤP ẢNH CÔNG CHÚA -->
  <div id="snapshot-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop">
    <div class="bg-white rounded-3xl max-w-md w-full p-5 sm:p-6 border-4 border-pink-200 shadow-2xl relative animate-[fadeIn_0.25s_ease-out]">
      <button onclick="closeSnapshotModal()" class="absolute top-3.5 right-3.5 w-9 h-9 rounded-full bg-pink-100 hover:bg-pink-200 text-pink-600 font-bold flex items-center justify-center">
        ✕
      </button>

      <div class="text-center mb-3">
        <span class="inline-block px-3 py-1 rounded-full bg-amber-100 text-amber-700 text-xs font-bold mb-1">
          ✨ Thẻ Chân Dung Hoàng Gia ✨
        </span>
        <h2 id="card-princess-title" class="font-royal text-xl sm:text-2xl font-bold text-pink-600">
          Công Chúa Hoa Hồng Lộng Lẫy
        </h2>
      </div>

      <!-- Khung xem trước ảnh chân dung -->
      <div class="relative mx-auto w-56 sm:w-64 aspect-[4/5] rounded-2xl overflow-hidden border-4 border-amber-300 shadow-lg mb-3 bg-pink-50">
        <img id="snapshot-preview-img" src="" alt="Chân dung công chúa" class="w-full h-full object-cover" />
      </div>

      <!-- Nhận xét phong cách -->
      <div class="bg-gradient-to-r from-pink-50 via-purple-50 to-amber-50 rounded-2xl p-3 border border-pink-200 text-center mb-4">
        <div id="card-stars" class="text-amber-400 text-lg tracking-widest mb-1">⭐⭐⭐⭐⭐</div>
        <p id="card-comment" class="text-xs sm:text-sm text-gray-700 font-medium leading-relaxed">
          Sự kết hợp hoàn hảo giữa vẻ đẹp dịu dàng và nét kiêu sa bậc nhất vương quốc!
        </p>
      </div>

      <!-- Nút hành động -->
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="saveToCollection()"
          class="btn-cute py-2.5 px-3 rounded-2xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-1.5">
          <span>💖</span>
          <span>Lưu Bộ Sưu Tập</span>

    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Phát hợp âm chuông lấp lánh nhẹ nhàng khi chọn đồ
    function playSparkleSound(type = 'select') {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const notes = type === 'magic' 
          ? [523.25, 659.25, 783.99, 1046.50, 1318.51] // Đô - Mi - Sol - Đô cao - Mi cao
          : type === 'camera'
          ? [880, 1174.66, 1567.98]
          : [659.25, 880, 1174.66]; // Chuông pha lê nhẹ

        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.045);

          gain.gain.setValueAtTime(0.001, now + idx * 0.045);
          gain.gain.exponentialRampToValueAtTime(0.08, now + idx * 0.045 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.045 + 0.28);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.045);
          osc.stop(now + idx * 0.045 + 0.3);
        });
      } catch (e) {
        // Bỏ qua nếu trình duyệt chặn autoplay audio
      }
    }

      soundEnabled = !soundEnabled;

        if (label) label.textContent = 'Âm thanh';
        playSparkleSound('select');

      } else {
        icon.textContent = '🔇';
        if (label) label.textContent = 'Đã tắt';
        showToast('🔇', 'Đã tắt âm thanh');
      }

      currentTab = tabName;
      playSparkleSound('select');

      // Cập nhật trạng thái nút tab
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.tab === tabName) {
          btn.classList.add('bg-gradient-to-r', 'from-pink-500', 'to-rose-500', 'text-white', 'border-pink-500', 'shadow-md');
          btn.classList.remove('bg-pink-50/80', 'text-pink-700', 'border-pink-100');
        } else {
          btn.classList.remove('bg-gradient-to-r', 'from-pink-500', 'to-rose-500', 'text-white', 'border-pink-500', 'shadow-md');
          btn.classList.add('bg-pink-50/80', 'text-pink-700', 'border-pink-100');
        }
      });

      renderWardrobePanel();
    }

    // Hiệu ứng hạt sao lấp lánh bung nở trên sân khấu
    function triggerMagicSparkles() {
      const layer = document.getElementById('sparkle-layer');
      const emojis = ['✨', '💖', '⭐', '🌸', '💎'];
      for (let i = 0; i < 12; i++) {
        const span = document.createElement('span');
        span.className = 'magic-sparkle text-lg sm:text-xl';
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        const startX = 35 + Math.random() * 30; // %
        const startY = 30 + Math.random() * 45; // %
        const dx = (Math.random() - 0.5) * 140 + 'px';
        const dy = (Math.random() - 0.5) * 140 + 'px';

        span.style.left = startX + '%';
        span.style.top = startY + '%';
        span.style.setProperty('--dx', dx);
        span.style.setProperty('--dy', dy);

        layer.appendChild(span);
        setTimeout(() => span.remove(), 900);
      }
    }

    function updateLiveScore() {
      const titles = ['Lộng Lẫy', 'Kiêu Sa', 'Ngọt Ngào', 'Rạng Rỡ', 'Tuyệt Mỹ'];
      let hash = 0;
      Object.values(state).forEach(val => {
        for (let i = 0; i < val.length; i++) hash += val.charCodeAt(i);
      });
      document.getElementById('live-style-score').textContent = titles[hash % titles.length];
    }

    // Chuyển đổi SVG sang PNG Data URL chất lượng cao (800x1000)
    function generatePrincessPNG(callback) {
      const svgEl = document.getElementById('princess-svg');
      const serializer = new XMLSerializer();
      let svgString = serializer.serializeToString(svgEl);

      // Đảm bảo có namespace chuẩn
      if (!svgString.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
        svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }

      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();

      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width = 800;
        canvas.height = 1000;
        const ctx = canvas.getContext('2d');

        // Vẽ ảnh công chúa lên canvas
        ctx.drawImage(img, 0, 0, 800, 1000);

        // Vẽ khung viền hoàng gia & chữ ký tên game tinh tế ở góc dưới
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 16;
        ctx.strokeRect(8, 8, 784, 984);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
        ctx.beginPath();
        ctx.roundRect(210, 935, 380, 42, 21);
        ctx.fill();

        ctx.fillStyle = '#db2777';
        ctx.font = 'bold 20px Quicksand, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✨ Phòng Thay Đồ Hoàng Gia ✨', 400, 963);

        URL.revokeObjectURL(url);
        callback(canvas.toDataURL('image/png'));
      };
      img.src = url;
    }

    let latestSnapshotDataUrl = '';

    function openSnapshotModal() {
      playSparkleSound('camera');
      const dressObj = GAME_DATA.dresses.find(d => d.id === state.dress) || GAME_DATA.dresses[0];
      const bgObj = GAME_DATA.backgrounds.find(b => b.id === state.background) || GAME_DATA.backgrounds[0];

      document.getElementById('card-princess-title').textContent = dressObj.title;
      document.getElementById('card-comment').textContent = 
        `Tỏa sáng rực rỡ tại ${bgObj.name}! Phong cách ${dressObj.name.toLowerCase()} kết hợp cùng kiểu tóc và trang điểm tinh tế khiến cả vương quốc phải trầm trồ.`;

      generatePrincessPNG((dataUrl) => {
        latestSnapshotDataUrl = dataUrl;
        document.getElementById('snapshot-preview-img').src = dataUrl;
        const modal = document.getElementById('snapshot-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      });
    }

    function closeSnapshotModal() {
      const modal = document.getElementById('snapshot-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function downloadPNG() {
      if (!latestSnapshotDataUrl) return;
      const link = document.createElement('a');
      link.download = `cong-chua-hoang-gia-${Date.now()}.png`;
      link.href = latestSnapshotDataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      playSparkleSound('magic');
      showToast('⬇️', 'Đang tải ảnh công chúa PNG về máy!');
    }

    function saveToCollection() {
      if (!latestSnapshotDataUrl) return;
      const dressObj = GAME_DATA.dresses.find(d => d.id === state.dress) || GAME_DATA.dresses[0];

      // Tạo ảnh thu nhỏ (thumbnail) để lưu nhẹ nhàng vào localStorage
      const img = new Image();
      img.onload = () => {
        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.width = 240;
        thumbCanvas.height = 300;
        thumbCanvas.getContext('2d').drawImage(img, 0, 0, 240, 300);
        const thumbUrl = thumbCanvas.toDataURL('image/jpeg', 0.82);

        savedCollection.unshift({
          id: Date.now(),
          title: dressObj.title,
          image: thumbUrl,
          state: { ...state }
        });

        // Giới hạn tối đa 12 bộ trang phục trong bộ sưu tập mini
        if (savedCollection.length > 12) savedCollection.pop();

        try {
          localStorage.setItem('royal_princess_gallery', JSON.stringify(savedCollection));
        } catch (e) {}

        updateGalleryBadge();
        playSparkleSound('magic');
        closeSnapshotModal();
        showToast('💖', 'Đã lưu vào Bộ Sưu Tập Hoàng Gia!');
      };
      img.src = latestSnapshotDataUrl;
    }

      document.getElementById('gallery-badge').textContent = savedCollection.length;
    }

      playSparkleSound('select');

    function loadFromGallery(id) {
      const item = savedCollection.find(x => x.id === id);
      if (!item) return;
      state = { ...item.state };
      renderPrincess();
      renderWardrobePanel();
      closeGalleryModal();
      playSparkleSound('magic');
      triggerMagicSparkles();
      showToast('👗', `Đã mặc lại bộ: ${item.title}`);
    }

    function deleteFromGallery(id, event) {
      event.stopPropagation();
      savedCollection = savedCollection.filter(x => x.id !== id);
      try {
        localStorage.setItem('royal_princess_gallery', JSON.stringify(savedCollection));
      } catch (e) {}
      updateGalleryBadge();
      renderGalleryGrid();
      showToast('🗑️', 'Đã xóa khỏi bộ sưu tập');
    }

    function renderGalleryGrid() {
      const grid = document.getElementById('gallery-grid');
      if (savedCollection.length === 0) {
        grid.innerHTML = `

    function showToast(icon, message) {
      const box = document.getElementById('toast-box');
      document.getElementById('toast-icon').textContent = icon;
      document.getElementById('toast-text').textContent = message;

      box.classList.remove('opacity-0', 'translate-y-4');
      box.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.add('opacity-0', 'translate-y-4');
        box.classList.remove('opacity-100', 'translate-y-0');
      }, 2400);
    }

    /* =========================================================================
       7. KHỞI TẠO TRÒ CHƠI KHI TẢI XONG TRANG
       ========================================================================= */
    window.onload = function () {
      renderPrincess();
      switchTab('face');
      updateGalleryBadge();
    };
  </script>
